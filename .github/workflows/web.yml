# The WebAssembly app: built on every push and pull request; on a push to the default branch (or when run by hand,
# from any branch) it's deployed to GitHub Pages at https://<owner>.github.io/<repository>/.
#
# Setup: Settings > Pages > Source: GitHub Actions. To deploy from a branch other than the default one, also allow it
# under Settings > Environments > github-pages > Deployment branches.
name: Web

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this branch to GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        shell: pwsh
        run: ./scripts/build-web.ps1 -Configuration ${{ matrix.configuration }} -BasePath "/${{ github.event.repository.name }}/" -Target GitHubPages

      - uses: actions/upload-artifact@v4
        with:
          name: AmiiTag-web-${{ matrix.configuration }}
          path: artifacts/web/${{ matrix.configuration }}
          include-hidden-files: true

      - name: Upload for GitHub Pages
        if: matrix.configuration == 'Release'
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/web/Release

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="theme-color" content="#000000" />
        <title>AmiiTag</title>
        <base href="/" />
        <style>
            /* Avoid a white flash before app.css loads. */
            html, body { background: #f2f2f7; }
            @media (prefers-color-scheme: dark) { html, body { background: #000; } }
        </style>
        <link rel="stylesheet" href="_content/AmiiTag.Core/css/app.css" />
        <link rel="stylesheet" href="AmiiTag.WebAssembly.styles.css" />
        <link rel="icon" type="image/png" href="favicon.png" />
        <link href="manifest.webmanifest" rel="manifest" />
        <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
        <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    </head>
    <body>
        <div id="app">
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>

        <div id="blazor-error-ui">
            An unhandled error has occurred.
            <a href="" class="reload">Reload</a>
            <a class="dismiss">🗙</a>
        </div>

        <script src="js/amiitag.js"></script>
        <script src="_framework/blazor.webassembly.js"></script>
        <script>navigator.serviceWorker.register('service-worker.js');</script>
    </body>
</html>
